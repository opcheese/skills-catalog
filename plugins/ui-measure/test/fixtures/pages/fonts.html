<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Wide Test"; src: url("/wide.ttf") format("truetype") }
  body { margin: 0 }
  /* Every glyph of the fixture font is one em wide; the monospace fallback is narrower. */
  #label { display: inline-block; font: 20px monospace }
  #label.wide { font-family: "Wide Test", monospace }
</style>
<div id="label">WWWW</div>
<script>
  // The download starts only once the page has loaded, so the load event cannot wait for it:
  // only document.fonts.ready covers it.
  window.addEventListener("load", () => {
    document.fonts.load('20px "Wide Test"')
    document.getElementById("label").classList.add("wide")
  })
</script>
